[package]
name = "workbench-tauri"
version = "0.1.0"
edition = "2021"
description = "Hermes Workbench - thin Tauri 2 shell (macOS)"
publish = false

[lib]
name = "workbench_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde_json = "1"
workbench-core = { path = "../core" }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
